<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 116">
  <!-- Logo du 30e anniversaire : silhouette de tête de Pikachu, « 3 » et « 0 » rouges sur les joues -->
  <defs>
    <clipPath id="earL"><path d="M22 62 C14 42 6 22 3 2 C22 8 42 22 56 42 Z"/></clipPath>
    <clipPath id="earR"><path d="M98 62 C106 42 114 22 117 2 C98 8 78 22 64 42 Z"/></clipPath>
  </defs>
  <g stroke="#e0b400" stroke-width="1.5" stroke-linejoin="round">
    <path d="M22 62 C14 42 6 22 3 2 C22 8 42 22 56 42 Z" fill="#ffd400"/>
    <path d="M98 62 C106 42 114 22 117 2 C98 8 78 22 64 42 Z" fill="#ffd400"/>
    <path d="M16 64 C16 42 38 34 60 34 C82 34 104 42 104 64 C114 78 112 96 99 106 C87 114 72 110 60 112 C48 110 33 114 21 106 C8 96 6 78 16 64 Z" fill="#ffd400"/>
  </g>
  <!-- Bouts noirs des oreilles -->
  <rect x="0" y="0" width="44" height="22" fill="#1d1d1d" clip-path="url(#earL)"/>
  <rect x="76" y="0" width="44" height="22" fill="#1d1d1d" clip-path="url(#earR)"/>
  <!-- 3 et 0 -->
  <text x="33" y="99" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial Black, Arial, sans-serif" font-weight="900" font-size="27" fill="#e1251b">3</text>
  <text x="87" y="99" text-anchor="middle" font-family="Arial Rounded MT Bold, Arial Black, Arial, sans-serif" font-weight="900" font-size="27" fill="#e1251b">0</text>
</svg>
